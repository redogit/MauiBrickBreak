name: Check GitHub Pages site

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/pages-site-status.yml'

permissions:
  contents: read
  pages: read

jobs:
  pages-site:
    runs-on: ubuntu-latest
    steps:
      - name: GET GitHub Pages site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "repos/${GITHUB_REPOSITORY}/pages" \
            | tee pages-site.json
      - name: Summarize
        run: |
          jq -r '"Pages: status=" + (.status // "unknown") + " url=" + (.html_url // "unknown") + " build_type=" + (.build_type // "unknown")' pages-site.json
