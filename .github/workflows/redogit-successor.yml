name: REDOGIT successor

on:
  push:
    branches: [master]
    paths:
      - 'REDOGIT.slnx'
      - 'redogit.json'
      - 'successors/redogit-2026-v2/**'
      - '.github/workflows/redogit-successor.yml'
  pull_request:
    paths:
      - 'REDOGIT.slnx'
      - 'redogit.json'
      - 'successors/redogit-2026-v2/**'
      - '.github/workflows/redogit-successor.yml'

permissions:
  contents: read

jobs:
  verify:
    uses: redogit/redogit/.github/workflows/verify-redogit.yml@10c49a25daaff74277bc8e0e84719fc289f4ad3f
    with:
      dotnet-version: '10.0.x'
