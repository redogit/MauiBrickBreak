name: REDOGIT successor

on:
  push:
    branches: [master]
    paths:
      - 'REDOGIT.slnx'
      - 'redogit.json'
      - 'successors/redogit-2026-v2/**'
      - '.github/workflows/redogit-successor.yml'
  pull_request:
    paths:
      - 'REDOGIT.slnx'
      - 'redogit.json'
      - 'successors/redogit-2026-v2/**'
      - '.github/workflows/redogit-successor.yml'

permissions:
  contents: read

jobs:
  verify:
    uses: redogit/redogit/.github/workflows/verify-redogit.yml@77c355fc1d62d7aab6d8b30dfe8e96593c7cba22
    with:
      dotnet-version: '10.0.x'
